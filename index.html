<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Develop Tools</title>

<style>
:root{
  --bg:#f5f6fa;
  --card:#fff;
  --primary:#4facfe;
}

body{
  margin:0;
  font-family:-apple-system,Segoe UI,Roboto;
  background:var(--bg);
}

/* header */
.header{
  min-height:240px;
  background:linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.4)),
             url("https://picsum.photos/1200/400") center/cover;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#fff;
}

.title{font-size:26px;margin-bottom:12px}

.search-box{
  display:flex;
  width:90%;
  max-width:500px;
}

.search-box input{
  flex:1;
  padding:10px;
  border:none;
  border-radius:8px 0 0 8px;
}

.search-box button{
  padding:10px 16px;
  border:none;
  background:var(--primary);
  color:#fff;
}

/* layout */
.container{
  width:95%;
  max-width:1100px;
  margin:20px auto;
}

.section{margin-bottom:24px}
.section-title{text-align:center;color:#666;margin-bottom:10px}

.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:12px;
}

/* button */
.tool-btn{
  padding:10px;
  border-radius:10px;
  color:#fff;
  text-align:center;
  text-decoration:none;
  transition:.2s;
}

.tool-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 12px rgba(0,0,0,.15);
}

.green{background:#2ecc71}
.blue{background:#3498db}
.orange{background:#f39c12}
.pink{background:#e84393}

/* mobile */
@media(max-width:600px){
  .card{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="title">Develop Tools</div>

  <div class="search-box">
    <input id="searchInput" placeholder="搜索..." />
    <button onclick="search()">Go</button>
  </div>

  <div style="height: 20px;"></div>
  
  <div class="quick-links">
    <button onclick="go('https://www.google.com')">谷歌</button>
    <button onclick="go('https://www.google.com/maps')">地图</button>
    <button onclick="go('https://translate.google.com')">翻译</button>
  </div>

</div>

<div id="app" class="container"></div>

<script>

function go(url) {
  window.open(url, "_blank");
}

/* ================= 配置区（以后只改这里） ================= */
const DATA = [
  {
    title: "Program Tools",
    items: [
      { name: "Deepseek", url: "https://chat.deepseek.com/", color: "green" },
      { name: "Claude", url: "https://claude.ai/", color: "blue" },
      { name: "Gemini", url: "https://gemini.google.com/", color: "orange" },
      { name: "ChatGPT", url: "https://chatgpt.com/", color: "pink" }
    ]
  },
  {
    title: "Art Tools",
    items: [
      { name: "TTF字体检测", url: "font-check/fontcheck.html", color: "green" },
      { name: "BMFont测试", url: "font-test/fonttest.html", color: "blue" },
      { name: "无损压图", url: "https://tinypng.com/", color: "orange" },
      { name: "spine-pngtowebp", url: "dist/index.html", color: "pink" }
    ]
  }
];

/* ================= 渲染 ================= */
function render(){
  const app = document.getElementById("app");

  app.innerHTML = DATA.map(section => `
    <div class="section">
      <div class="section-title">${section.title}</div>
      <div class="card">
        ${section.items.map(item => `
          <a class="tool-btn ${item.color}" href="${item.url}" target="_blank">
            ${item.name}
          </a>
        `).join("")}
      </div>
    </div>
  `).join("");
}

/* ================= 功能 ================= */
function search(){
  const v = document.getElementById("searchInput").value;
  if(!v) return;
  window.open("https://www.google.com/search?q=" + encodeURIComponent(v));
}

render();
</script>

</body>
</html>
